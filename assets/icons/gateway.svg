<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BFF gateway">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25282B"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
