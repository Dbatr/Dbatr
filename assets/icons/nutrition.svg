<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nutrition tracker">
  <defs>
    <linearGradient id="bg" x1="2" y1="2" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25282B"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>.pulse{animation:p 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}</style>
  </defs>
  <rect x="1" y="1" width="34" height="34" rx="10" fill="url(#bg)" stroke="#F04438" stroke-opacity=".5"/>
  <g transform="translate(6 6)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7C8.5 3.3 3 5.7 3 11.2C3 17.2 8.3 21.5 12 22C15.7 21.5 21 17.2 21 11.2C21 5.7 15.5 3.3 12 7Z" stroke="#F04438" stroke-width="1.8"/><path d="M12 7C12 4.2 13.5 2.5 16.5 2" stroke="#FFF0C2" stroke-opacity=".8" stroke-width="1.6"/><path d="M14.5 3C17 2.7 19 3.5 20.5 5.5C18 6.2 16 5.3 14.5 3Z" stroke="#FFF0C2" stroke-opacity=".72" stroke-width="1.4"/><path class="pulse" d="M8 13H16" stroke="#FFF0C2" stroke-width="1.5" filter="url(#glow)"/></g>
</svg>
