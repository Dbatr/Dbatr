<svg width="1000" height="74" viewBox="0 0 1000 74" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PROJECTS --FEATURED">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".55" stop-color="#17191E"/>
      <stop offset="1" stop-color="#25282B"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="15" x2="60" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F04438" stop-opacity=".24"/>
      <stop offset="1" stop-color="#F04438" stop-opacity=".06"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray:7 9; animation:flow 4s linear infinite; }
      .pulse { animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .cursor { animation:blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset:-64; } }
      @keyframes pulse { 0%,100% { opacity:.38; transform:scale(.75) } 50% { opacity:1; transform:scale(1.22) } }
      @keyframes blink { 0%,52% { opacity:1 } 53%,100% { opacity:.15 } }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="72" rx="16" fill="url(#panel)" stroke="#F04438" stroke-opacity=".32"/>
  <rect x="16" y="15" width="44" height="44" rx="12" fill="url(#accent)" stroke="#F04438" stroke-opacity=".58"/>
  <g transform="translate(26 25)" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="15" rx="3" stroke="#FFF0C2" stroke-opacity=".8" stroke-width="1.6"/><path d="M8 6V4.5C8 3.7 8.7 3 9.5 3H14.5C15.3 3 16 3.7 16 4.5V6" stroke="#F04438" stroke-width="1.8"/><path d="M2 12H22" stroke="#F04438" stroke-opacity=".7" stroke-width="1.6"/><circle cx="12" cy="12" r="1.8" fill="#F04438"/></g>
  <text x="78" y="32" fill="#F04438" font-size="16" font-weight="700">&gt;</text>
  <text x="98" y="32" fill="#FFF0C2" font-size="16" font-weight="700">PROJECTS --FEATURED</text>
  <rect class="cursor" x="288" y="18" width="7" height="17" rx="1" fill="#F04438"/>
  <text x="98" y="52" fill="#FFF0C2" fill-opacity=".42" font-size="10" letter-spacing="1.5">SELECTED BACKEND SYSTEMS</text>
  <path class="flow" d="M520 37H950" stroke="#F04438" stroke-opacity=".34" stroke-width="1.5"/>
  <circle class="pulse" cx="950" cy="37" r="4.5" fill="#F04438" filter="url(#glow)"/>
  <text x="968" y="41" text-anchor="middle" fill="#FFF0C2" fill-opacity=".36" font-size="9">04</text>
</svg>
